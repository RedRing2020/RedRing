[package]
name = "application"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Application-layer orchestration entrypoints and boundary DTO contracts"

[dependencies]
analysis = { path = "../../foundation/analysis" }
geo_contracts = { path = "../geo_contracts" }
geo_algorithms = { path = "../geo_algorithms" }
geo_entity = { path = "../geo_entity" }
geo_io = { path = "../geo_io" }
geo_primitives = { path = "../geo_primitives" }
geo_topology = { path = "../geo_topology" }
cam_algorithms = { path = "../cam_algorithms" }
cam_core = { path = "../cam_core" }
cam_entity = { path = "../cam_entity" }
cam_sim = { path = "../cam_sim" }
job_runtime = { path = "../job_runtime" }
job_domain = { path = "../job_domain" }
job_ipc = { path = "../job_ipc" }
tracing.workspace = true
uuid = { version = "1.11", features = ["v4"] }
chrono = "0.4"

[features]
# 試験用: 同じプロセスの中でジョブを実行するワークフロー（`CamSimulationWorkflow::in_process`）
test-fixtures = []

[dev-dependencies]
cam_sim = { path = "../cam_sim", features = ["test-fixtures"] }
job_manager = { path = "../job_manager" }
serde_json = "1.0.149"

[lints]
workspace = true
