[package]
name = "geo_io"
version = "0.1.0"
edition = "2021"
description = "File I/O operations for geometric data (STL, OBJ, PLY, etc.)"
license = "MIT OR Apache-2.0"

[dependencies]
geo_contracts = { path = "../geo_contracts" }
geo_primitives = { path = "../geo_primitives" }
logging_foundation = { path = "../../foundation/logging_foundation" }
tracing.workspace = true

# Error handling
thiserror = "2.0"

# SVG parsing
roxmltree = "0.20"

# Optional async support
tokio = { version = "1.0", features = ["fs", "io-util"], optional = true }

[features]
default = []
async = ["tokio"]

[dev-dependencies]
tempfile = "3.0"
