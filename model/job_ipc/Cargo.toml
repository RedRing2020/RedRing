[package]
name = "job_ipc"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Per-user local endpoint, frames and requests for asking the job manager"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
