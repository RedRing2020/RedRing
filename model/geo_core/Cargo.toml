[package]
name = "geo_core"
publish = false
version = "0.1.0"
edition = "2021"
description = "Tolerant geometric modeling foundation for RedRing CAD/CAM"
license = "MIT"

[dependencies]
# 数値計算の安定性
num-traits = "0.2"
analysis = { path = "../../foundation/analysis" }
approx = "0.5"                                    # 許容誤差ベース比較

# シリアル化サポート（オプション）
serde = { version = "1.0", optional = true, features = ["derive"] }

# テスト用
[dev-dependencies]
quickcheck = "1.0"
quickcheck_macros = "1.0"
criterion = "0.8.2"

[features]
default = []
serde-support = ["dep:serde"]

[lib]
name = "geo_core"
path = "src/lib.rs"

# [[bench]]
# name = "vector_ops"
# harness = false

[lints]
workspace = true
