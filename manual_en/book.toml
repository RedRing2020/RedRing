# 英語のマニュアル（日本語のマニュアルはルートの book.toml）。公開では、出力を日本語のマニュアルの en に置く
[book]
authors = ["RedRing Development Team"]
description = "RedRing CAD/CAM Platform Documentation"
language = "en"
src = "src"
title = "RedRing Documentation"

[build]
build-dir = "../target/book_en"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
smart-punctuation = true
mathjax-support = true
git-repository-url = "https://github.com/RedRing2020/RedRing"
edit-url-template = "https://github.com/RedRing2020/RedRing/edit/develop/manual_en/{path}"

[output.html.fold]
enable = true
level = 2

[output.html.print]
enable = true
