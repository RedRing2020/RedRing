[package]
name = "platform_foundation"
publish = false
version = "0.1.0"
edition.workspace = true
description = "Environment-independent wrappers for OS-dependent processing in the RedRing workspace"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
