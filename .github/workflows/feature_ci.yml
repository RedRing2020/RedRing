name: Feature Branch CI

on:
  pull_request:
    branches:
      - 'feature/**'

# 読み取りだけ（書き込みの権限は持たない）
permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Verify artifact binary wire format (cam_core)
        run: cargo test -p cam_core -- artifact_binary

      - name: Run tests
        run: cargo test --workspace --verbose

  architecture-dependency-check:
    uses: ./.github/workflows/common_architecture_check.yml
    with:
      verbose: true
      exit_on_error: true
