name: Feature Branch CI

on:
  pull_request:
    branches:
      - 'feature/**'

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: feature-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check issue document archive placement
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check_issue_doc_archive.ps1 -Repository "${{ github.repository }}" -ExitOnError

      - name: Run clippy
        run: cargo clippy --all -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Verify artifact binary wire format (cam_core)
        run: cargo test -p cam_core -- artifact_binary

      - name: Run tests
        run: cargo test --workspace --verbose

  architecture-dependency-check:
    uses: ./.github/workflows/common_architecture_check.yml
    with:
      verbose: true
      exit_on_error: true
