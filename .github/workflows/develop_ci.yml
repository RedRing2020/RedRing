name: Development CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# 基本的な権限設定（デプロイメント権限なし）
permissions:
  contents: read
  actions: read

# 並行実行制御
concurrency:
  group: develop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust-version: [stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-version }}
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Build documentation
        run: |
          cargo doc --workspace --no-deps --verbose
          echo "✅ Documentation built successfully (develop branch - no deployment)"

  architecture-dependency-check:
    name: Architecture Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Architecture dependency validation
        run: |
          echo "🏗️ RedRing Architecture Dependency Check"
          echo "📅 Date: $(date)"
          echo ""

          ERROR_COUNT=0
          WARNING_COUNT=0

          # Define workspace structure
          declare -A WORKSPACE_CRATES=(
            ["analysis"]="foundation/analysis"
            ["geo_foundation"]="model/geo_foundation"
            ["geo_commons"]="model/geo_commons"
            ["geo_core"]="model/geo_core"
            ["geo_primitives"]="model/geo_primitives"
            ["geo_algorithms"]="model/geo_algorithms"
            ["geo_io"]="model/geo_io"
            ["converter"]="viewmodel/converter"
            ["graphics"]="viewmodel/graphics"
            ["render"]="view/render"
            ["stage"]="view/stage"
            ["app"]="view/app"
          )

          # Define allowed dependencies
          declare -A ALLOWED_DEPS=(
            ["analysis"]=""
            ["geo_foundation"]="analysis geo_commons"
            ["geo_commons"]="analysis"
            ["geo_core"]="geo_foundation analysis"
            ["geo_primitives"]="geo_foundation analysis"
            ["geo_algorithms"]="geo_foundation geo_core geo_primitives analysis"
            ["geo_io"]="geo_foundation geo_core geo_primitives geo_algorithms analysis"
            ["converter"]="geo_foundation geo_core geo_primitives geo_algorithms geo_io analysis"
            ["graphics"]="geo_foundation geo_core geo_primitives analysis"
            ["render"]="analysis"
            ["stage"]="render analysis"
            ["app"]="converter graphics render stage analysis"
          )

          # Function to get crate dependencies
          get_crate_dependencies() {
            local crate_path="$1"
            local cargo_toml="$crate_path/Cargo.toml"

            if [ ! -f "$cargo_toml" ]; then
              return
            fi

            # Extract workspace dependencies from [dependencies] section
            awk '
              /^\[dependencies\]/ { in_deps = 1; next }
              /^\[/ && in_deps { in_deps = 0 }
              in_deps && /^[a-zA-Z_][a-zA-Z0-9_]*[[:space:]]*=/ {
                match($0, /^([a-zA-Z_][a-zA-Z0-9_]*)/, arr)
                dep_name = arr[1]
                # Check if it is a workspace crate
                if (dep_name == "analysis" || dep_name == "geo_foundation" ||
                    dep_name == "geo_commons" || dep_name == "geo_core" || dep_name == "geo_primitives" ||
                    dep_name == "geo_algorithms" || dep_name == "geo_io" ||
                    dep_name == "converter" || dep_name == "graphics" ||
                    dep_name == "render" || dep_name == "stage" || dep_name == "app") {
                  print dep_name
                }
              }
            ' "$cargo_toml"
          }

          echo "1️⃣ Model layer naming rule check:"
          MODEL_CRATES=("geo_foundation" "geo_commons" "geo_core" "geo_primitives" "geo_algorithms" "geo_io")
          for crate_name in "${MODEL_CRATES[@]}"; do
            if [ -d "${WORKSPACE_CRATES[$crate_name]}" ]; then
              echo "  ✅ $crate_name follows geo_ prefix rule"
            else
              echo "  ❌ Required Model crate '$crate_name' not found"
              ((ERROR_COUNT++))
            fi
          done
          echo ""

          echo "2️⃣ Dependency rule check:"
          for crate_name in "${!WORKSPACE_CRATES[@]}"; do
            crate_path="${WORKSPACE_CRATES[$crate_name]}"

            if [ -d "$crate_path" ]; then
              echo "  🔍 Checking: $crate_name"

              # Get actual dependencies
              actual_deps=$(get_crate_dependencies "$crate_path")
              allowed_deps="${ALLOWED_DEPS[$crate_name]}"

              if [ -n "$actual_deps" ]; then
                for dep in $actual_deps; do
                  if echo "$allowed_deps" | grep -q "\b$dep\b"; then
                    echo "    ✅ $crate_name -> $dep (allowed)"
                  else
                    echo "    ❌ $crate_name -> $dep (not allowed)"
                    ((ERROR_COUNT++))
                  fi
                done
              else
                echo "    ℹ️ No workspace dependencies"
              fi
            else
              echo "  ⚠️ Crate path not found: $crate_path"
              ((WARNING_COUNT++))
            fi
          done
          echo ""

          echo "3️⃣ Layer dependency summary:"
          declare -A LAYERS=(
            ["Analysis"]="analysis"
            ["Model"]="geo_foundation geo_commons geo_core geo_primitives geo_algorithms geo_io"
            ["ViewModel"]="converter graphics"
            ["View"]="render stage app"
          )

          for layer_name in "${!LAYERS[@]}"; do
            echo "  📋 $layer_name layer:"
            for crate_name in ${LAYERS[$layer_name]}; do
              if [ -d "${WORKSPACE_CRATES[$crate_name]}" ]; then
                deps=$(get_crate_dependencies "${WORKSPACE_CRATES[$crate_name]}")
                if [ -n "$deps" ]; then
                  echo "    $crate_name -> $deps"
                else
                  echo "    $crate_name -> (no deps)"
                fi
              else
                echo "    $crate_name -> (not found)"
              fi
            done
          done
          echo ""

          echo "4️⃣ Foundation architecture validation:"

          # geo_foundation basic structure check
          if [ -f "model/geo_foundation/Cargo.toml" ]; then
            echo "  ✅ model/geo_foundation/Cargo.toml found"
          else
            echo "  ❌ model/geo_foundation/Cargo.toml not found"
            ((ERROR_COUNT++))
          fi

          # TransformError integration check
          if grep -r "TransformError" model/geo_foundation/src/ > /dev/null 2>&1; then
            echo "  ✅ TransformError found in model/geo_foundation"
          else
            echo "  ❌ TransformError not found in model/geo_foundation"
            ((ERROR_COUNT++))
          fi

          # Check for duplicate TransformError in geo_primitives
          if grep -r "enum TransformError" model/geo_primitives/src/ > /dev/null 2>&1; then
            echo "  ❌ Duplicate TransformError found in model/geo_primitives"
            ((ERROR_COUNT++))
          else
            echo "  ✅ No duplicate TransformError in geo_primitives"
          fi

          # Check for forbidden direct geo_primitives imports
          echo "  🔍 Checking for forbidden direct geo_primitives imports..."

          FORBIDDEN_IMPORTS=""
          for file in $(find . -name "*.rs" -not -path "./model/geo_primitives/*" -not -path "./target/*"); do
            if grep -q "^[[:space:]]*use geo_primitives::" "$file"; then
              if ! echo "$file" | grep -qE "^\./viewmodel/converter/|^\./model/geo_foundation/|^\./model/geo_io/"; then
                echo "    ❌ Forbidden import in: $file"
                grep -n "use geo_primitives::" "$file"
                FORBIDDEN_IMPORTS="found"
                ((ERROR_COUNT++))
              fi
            fi
          done

          if [ -z "$FORBIDDEN_IMPORTS" ]; then
            echo "  ✅ No forbidden direct geo_primitives imports found"
          fi
          echo ""

          echo "5️⃣ Results:"
          if [ $ERROR_COUNT -eq 0 ] && [ $WARNING_COUNT -eq 0 ]; then
            echo "  🎉 SUCCESS: All architecture dependency checks passed!"
            echo "  ✅ View -> ViewModel -> Model direction maintained"
            echo "  ✅ Model layer naming rules (geo_*) followed"
            echo "  ✅ No forbidden dependencies detected"
            echo "  ✅ Foundation architecture is compliant"
          else
            echo "  🚨 FAILED: Architecture dependency issues found"
            echo "  ❌ Errors: $ERROR_COUNT"
            echo "  ⚠️ Warnings: $WARNING_COUNT"

            if [ $ERROR_COUNT -gt 0 ]; then
              echo "  🛑 Exiting due to detected errors"
              exit 1
            fi
          fi

  check-no-deployment:
    name: Development Branch Status
    runs-on: ubuntu-latest
    needs: [build-test, architecture-dependency-check]

    steps:
      - name: Development branch notification
        run: |
          echo "🚀 Development CI completed successfully"
          echo "📋 Branch: ${{ github.ref_name }}"
          echo "🔄 Event: ${{ github.event_name }}"
          echo "ℹ️  No deployment occurs on development branches"
          echo "📖 Documentation deployment only occurs on the 'main' branch"
          echo "✅ All development checks passed"
