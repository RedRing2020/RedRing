name: Dependency Audit

# 依存クレートの検査（cargo deny）。設定は deny.toml、扱いは dev/DEPENDENCY_AUDIT_OPERATION.md
on:
  push:
    branches: [develop, main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/dependency_audit.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/dependency_audit.yml"
  # 依存を変えていなくても、新しく見つかった脆弱性に気づけるように、週に 1 回回す（月曜 9:00 JST）
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # 新しく見つかった脆弱性は、依存を変えていない PR を止めないように、PR では失敗にしない（週の実行と push で知らせる）
    continue-on-error: ${{ github.event_name == 'pull_request' && matrix.checks == 'advisories' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
