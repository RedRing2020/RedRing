[package]
name = "redring"
publish = false
version = "0.1.3"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
winit = "0.30.13"
wgpu = "30.0.0"
pollster.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
viewmodel = { path = "../../viewmodel/converter" }
viewmodel-graphics = { path = "../../viewmodel/graphics" }
render = { path = "../render" }
stage = { path = "../stage" }
analysis = { path = "../../foundation/analysis" }
logging_foundation = { path = "../../foundation/logging_foundation" }
bytemuck = { version = "1.24", features = ["derive"] }
# 0.37 から標準のフォントが既定で入らないため、英字のフォントと、記号（▲・▼・→ など）のフォントを入れる（日本語は OS の
# フォントを足す）
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
fontdb = "0.24"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

[lints]
workspace = true
