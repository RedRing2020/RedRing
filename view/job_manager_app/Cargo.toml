[package]
name = "job_manager_app"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "redring-job-manager"
path = "src/main.rs"

[dependencies]
job_manager = { path = "../../model/job_manager" }
job_runtime = { path = "../../model/job_runtime" }
job_ipc = { path = "../../model/job_ipc" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# accesskit（画面の読み上げ）は、保守の終わった依存を含むため使わない（CAD/CAM のアプリと同じ）
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
# 状態の記号（⏸・▶・✔・⚠・⏹・☰）のフォントを入れる（0.37 から、標準のフォントには入らない）
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
fontdb = "0.24"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
