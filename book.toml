[book]
authors = ["RedRing Development Team"]
description = "RedRing CAD/CAM Platform Documentation - 高性能CAD/CAMソフトウェア開発プラットフォーム"
language = "ja"
src = "manual"
title = "RedRing Documentation"

[build]
# 出力先は追跡しない target の下（公開は CI の Actions で行う）
build-dir = "target/book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
smart-punctuation = true
mathjax-support = true
git-repository-url = "https://github.com/RedRing2020/RedRing"
edit-url-template = "https://github.com/RedRing2020/RedRing/edit/develop/{path}"

[output.html.fold]
enable = true
level = 2

[output.html.print]
enable = true
