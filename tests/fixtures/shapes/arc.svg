<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="-1 -1 3 3">
  <!-- 円弧（半径 1.5 の 4 分円）と楕円弧（半径 1.5 × 0.75 の半周） -->
  <path d="M 1.5 0 A 1.5 1.5 0 0 1 0 1.5" fill="none" stroke="green" stroke-width="0.1"/>
  <path d="M -1.5 0 A 1.5 0.75 0 0 1 1.5 0" fill="none" stroke="blue" stroke-width="0.1"/>
</svg>
